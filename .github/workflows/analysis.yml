name: Reproduce analysis

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Recompute results and verify independent arithmetic
        run: python src/analyze.py
      - name: Execute the teaching notebook
        run: python scripts/execute_notebook.py
